name: structure

on:
  pull_request:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run public structure checks
        run: python tools/run_structure_checks.py
